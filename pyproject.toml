[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atg-dsc-corrector"
version = "1.0.1"
description = "ThermalCurve - Analyse thermique / Thermal analysis (ATG-DSC)"
authors = [{name = "Valentin Legrand", email = "valentin.legrand@emse.fr"}]
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.txt", "THIRD_PARTY_NOTICES.txt", "licenses/**/*"]
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "PySide6==6.11.1",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "openpyxl>=3.1.5",
    "XlsxWriter==3.2.9",
    "pandas>=3.0",
    "xlrd>=2.0.2",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-qt==4.5.0",
    "pyinstaller>=6.0",
    "xlwt>=1.3",
]

[project.scripts]
thermalcurve = "atg_dsc_corrector.gui_qt.app:main"
atg-dsc-corrector = "atg_dsc_corrector.gui_qt.app:main"
atg-dsc-corrector-qt = "atg_dsc_corrector.gui_qt.app:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["atg_dsc_corrector*"]

[tool.setuptools.package-data]
atg_dsc_corrector = ["resources/mendeleev/v0.20.0/*", "resources/thermalcurve.ico", "resources/thermalcurve.svg"]
